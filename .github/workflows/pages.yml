name: Deploy to GitHub Pages

# Publishes the app to GitHub Pages on every push to the default branch.
# One-time setup: in the repository's Settings → Pages, set "Source" to
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can count the day's revisions

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Assemble site
        run: |
          # Keep the demo in sync with the app, then stage only what ships.
          python3 tools/build_demo.py
          mkdir -p _site
          cp -r index.html demo.html manifest.webmanifest sw.js vendor icons _site/
          touch _site/.nojekyll

          # Build version: vYYYY.MM.DD.<revisions deployed that UTC date>.
          TODAY=$(date -u +%Y-%m-%d)
          REV=$(git log --first-parent --pretty=%cd --date=short | grep -c "^${TODAY}$" || true)
          [ -z "$REV" ] && REV=0
          VER="v$(date -u +%Y.%m.%d).$(printf '%03d' "$REV")"
          echo "Build version: $VER"
          sed -i "s/__BUILD_VERSION__/${VER}/g" _site/index.html _site/demo.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
